<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1014" />
  <meta name="description" content="두 글자 단어로 자음과 모음을 타고 점프해서 20개 스테이지를 올라가는 한글 퍼즐." />
  <meta property="og:title" content="자모 점프" />
  <meta property="og:description" content="두 글자 단어로 자음과 모음을 타고 점프해서 깃발까지." />
  <title>자모 점프</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='52' rx='12' fill='%232E3039'/%3E%3Crect x='4' y='50' width='56' height='10' rx='5' fill='%230A0B0E'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='%23F2F3F7' font-family='sans-serif' font-weight='900'%3E%E3%84%B1%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <div id="app">
    <section id="splash" class="screen active" aria-label="자모 점프">
      <div class="splash-logo">
        <span class="splash-pawn" aria-hidden="true"><i></i></span>
        <div class="logo-tiles" aria-hidden="true"><i>자</i><i>모</i><i>점</i><i>프</i></div>
      </div>
    </section>

    <section id="home" class="screen" aria-label="처음 화면">
      <header class="home-head">
        <div class="mini-logo" aria-label="자모 점프"><i>자</i><i>모</i><i>점</i><i>프</i></div>
        <button class="icon-btn" id="btn-tutorial" type="button" aria-label="튜토리얼 다시 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4M12 16.8v.2" /></svg>
        </button>
      </header>

      <button id="daily-card" class="card daily" type="button">
        <span class="card-top"><span class="card-kicker">오늘의 도전</span><span id="daily-date" class="card-meta"></span></span>
        <span id="daily-rounds" class="daily-rounds"></span>
        <span class="card-bottom"><span id="daily-note" class="card-note"></span><span id="daily-cta" class="card-cta"></span></span>
      </button>

      <div class="card endless">
        <div class="card-top"><span class="card-kicker">무한 모드</span><span id="endless-best" class="card-meta"></span></div>
        <div class="seg" role="radiogroup" aria-label="무한 모드 난이도">
          <button type="button" role="radio" data-level="easy" aria-checked="false">쉬움</button>
          <button type="button" role="radio" data-level="normal" aria-checked="true">보통</button>
          <button type="button" role="radio" data-level="hard" aria-checked="false">어려움</button>
        </div>
        <button id="endless-go" class="btn-primary wide" type="button">시작</button>
      </div>

      <p class="map-credit">〈네 가지 소원〉 EP.2 숨바꼭질 게임을 차용해 만들었어요 · <a href="https://youtu.be/jtg5pXJ7cQM" target="_blank" rel="noopener">원본 영상</a></p>
    </section>

    <section id="map" class="screen" aria-label="스테이지 지도">
      <header class="map-head">
        <button class="icon-btn" id="map-back" type="button" aria-label="처음으로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <strong id="map-title" class="map-title">오늘의 도전</strong>
        <span id="star-total" class="star-total"></span>
      </header>
      <div id="tower-wrap" class="tower-wrap"><div id="tower" class="tower"></div></div>
      <footer class="map-foot">
        <button id="map-play" class="play-btn" type="button"></button>
      </footer>
    </section>

    <section id="play" class="screen" aria-label="게임">
      <header class="bar">
        <button class="icon-btn" id="btn-back" type="button" aria-label="지도로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div class="bar-mid">
          <strong id="stage-title" class="stage-title"></strong>
          <div id="prog" class="prog" aria-hidden="true"></div>
          <span id="bar-sub" class="bar-sub" hidden></span>
          <div id="timer" class="timer" hidden><i id="timer-fill"></i></div>
        </div>
        <div class="bar-right">
          <button class="pill-btn" id="btn-hint" type="button"></button>
          <span id="clock" class="clock" hidden></span>
        </div>
      </header>

      <p id="cond" class="cond" hidden></p>
      <div id="board" class="board-host"></div>

      <div class="bottom">
      <div id="coach" class="coach" hidden>
        <div id="coach-dots" class="coach-dots" aria-hidden="true"></div>
        <p id="coach-title" class="coach-title"></p>
        <p id="coach-sub" class="coach-sub"></p>
        <div id="coach-letters" class="coach-letters"></div>
        <button id="coach-next" class="btn-primary wide" type="button"></button>
      </div>

      <form id="dock" class="dock" autocomplete="off">
        <div id="abilities" class="abilities" aria-live="polite"></div>
        <div class="field" id="field">
          <label for="answer" class="sr-only">두 글자 단어</label>
          <input id="answer" type="text" lang="ko" placeholder="두 글자 단어" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" />
          <button id="btn-submit" class="btn-primary" type="submit" aria-label="점프">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M12 6l6 6-6 6" /></svg>
          </button>
        </div>
      </form>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="scrim" class="scrim" hidden></div>

  <section id="intro" class="sheet" aria-hidden="true" aria-labelledby="intro-title">
    <div class="handle" aria-hidden="true"></div>
    <p id="intro-badge" class="intro-badge"></p>
    <h2 id="intro-title" class="intro-title"></h2>
    <p id="intro-sub" class="intro-sub"></p>
    <div class="sheet-actions"><button id="intro-go" class="btn-primary wide" type="button"></button></div>
  </section>

  <section id="result" class="sheet" aria-hidden="true" aria-labelledby="res-kicker">
    <div class="handle" aria-hidden="true"></div>
    <p id="res-kicker" class="kicker"></p>
    <div id="res-stars" class="stars-row"></div>
    <div id="res-word" class="word"></div>
    <div id="res-steps" class="steps"></div>
    <details id="res-others" class="others"><summary></summary><p></p></details>
    <div class="sheet-actions">
      <button id="res-next" class="btn-primary wide" type="button"></button>
      <button id="res-map" class="btn-text" type="button">지도</button>
    </div>
  </section>

  <section id="settle" class="sheet" aria-hidden="true" aria-labelledby="settle-title">
    <div class="handle" aria-hidden="true"></div>
    <p id="settle-kicker" class="kicker muted"></p>
    <h2 id="settle-title" class="verdict sm"></h2>
    <div id="settle-stars" class="stars-row"></div>
    <ul id="settle-rounds" class="settle-rounds"></ul>
    <p id="settle-next" class="settle-next"></p>
    <div class="sheet-actions">
      <button id="settle-primary" class="btn-primary wide" type="button"></button>
      <button id="settle-secondary" class="btn-text" type="button"></button>
    </div>
  </section>

  <script src="words.js?v=12"></script>
  <script src="fam.js?v=12"></script>
  <script src="engine.js?v=12"></script>
  <script src="gen.js?v=12"></script>
  <script src="bosses.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
